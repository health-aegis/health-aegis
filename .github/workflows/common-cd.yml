name: Common_CD

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      helm-chart-key:
        required: true
        type: string
      env:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      GITOPS_PAT:
        required: true

jobs:
  update-manifest:
    name: "CD – ${{ inputs.service-name }} @ ${{ inputs.tag }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout k8s-manifests
        uses: actions/checkout@v4
        with:
          repository: health-aegis/k8s-manifests
          token:      ${{ secrets.GITOPS_PAT }}
          path:       manifest-repo

      - name: Patch image tag
        run: |
          VALUES="manifest-repo/charts/${{ inputs.helm-chart-key }}/values-dev.yaml"

          if [ ! -f "$VALUES" ]; then
            echo "⚠ ${VALUES} not found — skipping"
            exit 0
          fi

          NEW_TAG="${{ inputs.tag }}" \
            yq e '.image.tag = env(NEW_TAG)' -i "${VALUES}"

          echo "✓ ${{ inputs.helm-chart-key }}.image.tag → ${{ inputs.tag }}"

      - name: Commit and push to k8s-manifests
        run: |
          cd manifest-repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "charts/${{ inputs.helm-chart-key }}/values-dev.yaml"

          if git diff --cached --quiet; then
            echo "No changes — tag already up to date."
            exit 0
          fi

          git commit -m "chore(${{ inputs.service-name }}): bump image tag to ${{ inputs.tag }} [skip ci]"

          git pull --rebase origin main
          git push origin HEAD:main
