# ---------------------------------------------------------------------------
# Aegis Health — Common CD (reusable)
#
# Called via workflow_call from deploy.yml (dev) or release-prod.yml (prod).
# Patches a single service's image.tag in the umbrella values.yaml inside
# health-aegis/k8s-manifests and pushes the change so ArgoCD picks it up.
#
# Inputs
#   service-name   – Docker image / commit-message label  (e.g. api-gateway)
#   helm-chart-key – Top-level key in environments/<env>/values.yaml
#   env            – Target environment: dev | prod
#   tag            – Exact image tag to set  (sha-abc1234 or v1.2.3)
#
# Secrets
#   GITOPS_PAT     – GitHub PAT with repo write on health-aegis/k8s-manifests
# ---------------------------------------------------------------------------

name: Common_CD

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
        description: "Docker image / label (e.g. api-gateway)"
      helm-chart-key:
        required: true
        type: string
        description: "Top-level key in environments/<env>/values.yaml"
      env:
        required: true
        type: string
        description: "Target environment: dev or prod"
      tag:
        required: true
        type: string
        description: "Image tag to set (e.g. sha-abc1234 or v1.2.3)"
    secrets:
      GITOPS_PAT:
        required: true

jobs:
  update-manifest:
    name: "CD – ${{ inputs.service-name }} → ${{ inputs.env }} @ ${{ inputs.tag }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout k8s-manifests
        uses: actions/checkout@v4
        with:
          repository: health-aegis/k8s-manifests
          token:      ${{ secrets.GITOPS_PAT }}
          path:       manifest-repo

      - name: Patch image tag in umbrella values
        run: |
          VALUES="manifest-repo/environments/${{ inputs.env }}/values.yaml"

          if [ ! -f "$VALUES" ]; then
            echo "⚠ ${VALUES} not found — k8s-manifests may not have been bootstrapped yet"
            exit 1
          fi

          # yq env() handles hyphenated keys safely (e.g. "health-records-service")
          HELM_KEY_NAME="${{ inputs.helm-chart-key }}" \
          NEW_TAG="${{ inputs.tag }}" \
            yq e '.[env(HELM_KEY_NAME)].image.tag = env(NEW_TAG)' -i "${VALUES}"

          echo "✓ ${{ inputs.helm-chart-key }}.image.tag → ${{ inputs.tag }}"

      - name: Commit and push to k8s-manifests
        run: |
          cd manifest-repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "environments/${{ inputs.env }}/values.yaml"

          if git diff --cached --quiet; then
            echo "No changes — tag already up to date."
            exit 0
          fi

          git commit -m "chore(${{ inputs.service-name }}): bump ${{ inputs.env }} image tag to ${{ inputs.tag }} [skip ci]"

          # Rebase in case another service pushed concurrently, then push
          git pull --rebase origin main
          git push origin HEAD:main
