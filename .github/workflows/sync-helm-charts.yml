name: Sync Helm Charts

on:
  push:
    branches: [main, develop]
    paths:
      - 'helm/charts/**'
      - 'helm/environments/**'

concurrency:
  group: sync-charts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: "Sync chart templates → k8s-manifests"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout health-aegis
        uses: actions/checkout@v4

      - name: Checkout k8s-manifests
        uses: actions/checkout@v4
        with:
          repository: health-aegis/k8s-manifests
          token:      ${{ secrets.GITOPS_PAT }}
          path:       k8s-manifests

      - name: Sync chart templates
        run: |
          SERVICES=(
            api-gateway
            health-records-service
            medication-service
            ai-service
            notification-worker
            imaging-service
            diagnostic-agent-service
            coordinator-agent
            image-analysis-agent
            patient-history-agent
            client
          )

          for SVC in "${SERVICES[@]}"; do
            SRC="helm/charts/${SVC}"
            DST="k8s-manifests/charts/${SVC}"

            if [ ! -d "$SRC" ] || [ ! -d "$DST" ]; then
              continue
            fi

            rsync -a --delete "${SRC}/templates/" "${DST}/templates/"

            cp "${SRC}/Chart.yaml" "${DST}/Chart.yaml"
            cp "${SRC}/values.yaml" "${DST}/values.yaml"

            echo "  ✓ synced charts/${SVC}"
          done

          for ENV_NAME in dev prod; do
            SRC="helm/environments/${ENV_NAME}"
            DST="k8s-manifests/environments/${ENV_NAME}"

            [ ! -d "$SRC" ] && continue
            mkdir -p "${DST}/templates"

            cp "${SRC}/Chart.yaml" "${DST}/Chart.yaml"
            rsync -a --delete "${SRC}/templates/" "${DST}/templates/"

            if [ -f "${DST}/values.yaml" ]; then
              # Save current image tags — deploy.yml owns these values
              yq 'to_entries | map(select(.value | type == "!!map") | select(.value | has("image"))) | from_entries | with_entries(.value = {"image": {"tag": .value.image.tag}})' \
                "${DST}/values.yaml" > /tmp/saved-tags.yaml

              cp "${SRC}/values.yaml" "${DST}/values.yaml"

              # Restore saved image tags on top of updated static config
              yq -i '. *+ load("/tmp/saved-tags.yaml")' "${DST}/values.yaml"
            else
              cp "${SRC}/values.yaml" "${DST}/values.yaml"
            fi

            echo "  ✓ synced environments/${ENV_NAME}"
          done

      - name: Commit and push to k8s-manifests
        working-directory: k8s-manifests
        env:
          BRANCH: ${{ github.ref_name }}
          SHA:    ${{ github.sha }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add charts/ environments/
          git diff --cached --quiet \
            && echo "No chart or environment changes to sync." \
            && exit 0

          git commit -m "chore(charts): sync Helm templates from health-aegis [${BRANCH}] [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
