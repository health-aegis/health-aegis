name: Release — Production

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

concurrency:
  group: release-prod-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: "Release – Prepare"
    runs-on: ubuntu-latest
    outputs:
      tag:    ${{ steps.out.outputs.tag }}
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - name: Set release tag
        id: out
        run: echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build full service matrix
        id: matrix
        run: |
          cat >> "$GITHUB_OUTPUT" <<'MATRIX'
          matrix={"include":[
            {"service":"api-gateway","context":".","dockerfile":"services/api-gateway/Dockerfile","lang":"node","dir":"services/api-gateway"},
            {"service":"health-records-service","context":"services/health-records-service","dockerfile":"services/health-records-service/Dockerfile","lang":"node","dir":"services/health-records-service"},
            {"service":"medication-service","context":"services/medication-service","dockerfile":"services/medication-service/Dockerfile","lang":"node","dir":"services/medication-service"},
            {"service":"ai-service","context":"services/ai-service","dockerfile":"services/ai-service/Dockerfile","lang":"node","dir":"services/ai-service"},
            {"service":"notification-worker","context":"services/notification-worker","dockerfile":"services/notification-worker/Dockerfile","lang":"node","dir":"services/notification-worker"},
            {"service":"imaging-service","context":"services/imaging-service","dockerfile":"services/imaging-service/Dockerfile","lang":"python","dir":"services/imaging-service"},
            {"service":"diagnostic-agent-service","context":"services/diagnostic-agent-service","dockerfile":"services/diagnostic-agent-service/Dockerfile","lang":"python","dir":"services/diagnostic-agent-service"},
            {"service":"coordinator-agent","context":"services/coordinator-agent","dockerfile":"services/coordinator-agent/Dockerfile","lang":"python","dir":"services/coordinator-agent"},
            {"service":"image-analysis-agent","context":"services/image-analysis-agent","dockerfile":"services/image-analysis-agent/Dockerfile","lang":"python","dir":"services/image-analysis-agent"},
            {"service":"patient-history-agent","context":"services/patient-history-agent","dockerfile":"services/patient-history-agent/Dockerfile","lang":"python","dir":"services/patient-history-agent"},
            {"service":"client","context":".","dockerfile":"client/Dockerfile","lang":"node","dir":"client"}
          ]}
          MATRIX

  build:
    name: "Release – Build — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context:    ${{ matrix.context }}
          file:       ${{ matrix.dockerfile }}
          push:       false
          load:       true
          tags:       ${{ secrets.PROD_ACR_NAME }}.azurecr.io/${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,scope=${{ matrix.service }},mode=max
          build-args: |
            ${{ matrix.service == 'client' && format('VITE_API_URL={0}', secrets.VITE_API_URL) || '' }}

      - name: Save image artifact
        run: |
          IMAGE="${{ secrets.PROD_ACR_NAME }}.azurecr.io/${{ matrix.service }}:${{ needs.prepare.outputs.tag }}"
          docker save "$IMAGE" | gzip > /tmp/${{ matrix.service }}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name:           image-${{ matrix.service }}-${{ needs.prepare.outputs.tag }}
          path:           /tmp/${{ matrix.service }}.tar.gz
          retention-days: 1

  trivy:
    name: "Release – Trivy — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    permissions:
      contents:        read
      security-events: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ needs.prepare.outputs.tag }}
          path: /tmp

      - name: Load image
        run: docker load < /tmp/${{ matrix.service }}.tar.gz

      - name: Trivy vulnerability scan (enforce gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:      ${{ secrets.PROD_ACR_NAME }}.azurecr.io/${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
          format:         table
          severity:       HIGH,CRITICAL
          exit-code:      '1'
          ignore-unfixed: true
          scanners:       vuln

      - name: Trivy SARIF upload
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref:      ${{ secrets.PROD_ACR_NAME }}.azurecr.io/${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
          format:         sarif
          output:         trivy-${{ matrix.service }}.sarif
          severity:       HIGH,CRITICAL
          exit-code:      '0'
          ignore-unfixed: true
          scanners:       vuln

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category:   trivy-prod-${{ matrix.service }}

  await-approval:
    name: "Release – Await production approval"
    runs-on: ubuntu-latest
    needs: trivy
    if: needs.trivy.result == 'success'
    environment: production
    steps:
      - name: Approval granted
        run: echo "✅ Production release approved — proceeding to push."

  push-prod:
    name: "Release – Push — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [prepare, await-approval]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ needs.prepare.outputs.tag }}
          path: /tmp

      - name: Load image
        run: docker load < /tmp/${{ matrix.service }}.tar.gz

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to prod ACR
        run: az acr login --name ${{ secrets.PROD_ACR_NAME }}

      - name: Push to prod ACR
        run: |
          docker push "${{ secrets.PROD_ACR_NAME }}.azurecr.io/${{ matrix.service }}:${{ needs.prepare.outputs.tag }}"
          echo "  ✓ pushed ${{ matrix.service }}:${{ needs.prepare.outputs.tag }} to ${{ secrets.PROD_ACR_NAME }}"

  update-manifest:
    name: "Release – Update prod manifest"
    runs-on: ubuntu-latest
    needs: [prepare, push-prod]
    if: needs.push-prod.result == 'success'

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Checkout k8s-manifests
        uses: actions/checkout@v4
        with:
          repository: health-aegis/k8s-manifests
          token:      ${{ secrets.GITOPS_PAT }}
          path:       k8s-manifests

      - name: Patch prod image tags to ${{ needs.prepare.outputs.tag }}
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          VALUES="k8s-manifests/environments/prod/values.yaml"

          if [ ! -f "$VALUES" ]; then
            SRC="helm/environments/prod"
            echo "⚕ Bootstrapping k8s-manifests/environments/prod/"
            mkdir -p "k8s-manifests/environments/prod/templates"
            cp "${SRC}/Chart.yaml" "k8s-manifests/environments/prod/Chart.yaml"
            rsync -a "${SRC}/templates/" "k8s-manifests/environments/prod/templates/"
            cp "${SRC}/values.yaml" "${VALUES}"
          fi

          SERVICES=(
            api-gateway health-records-service medication-service ai-service
            notification-worker imaging-service diagnostic-agent-service
            coordinator-agent image-analysis-agent patient-history-agent client
          )
          for SVC in "${SERVICES[@]}"; do
            yq -i ".\"${SVC}\".image.tag = \"${TAG}\"" "${VALUES}"
            echo "  ✓ ${SVC}.image.tag → ${TAG}"
          done

      - name: Commit release tag bump to k8s-manifests
        working-directory: k8s-manifests
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add environments/prod/
          git diff --cached --quiet \
            && echo "No prod tag changes to commit." \
            && exit 0

          git commit -m "chore(release): bump prod image tags to ${TAG} [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

  notify:
    name: "Release – Notify"
    runs-on: ubuntu-latest
    needs: [prepare, build, trivy, await-approval, push-prod, update-manifest]
    if: always()
    steps:
      - name: Resolve status
        id: status
        run: |
          RESULTS="${{ join(needs.*.result, ',') }}"
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then
            echo "value=failure" >> "$GITHUB_OUTPUT"; echo "emoji=❌" >> "$GITHUB_OUTPUT"
          else
            echo "value=success" >> "$GITHUB_OUTPUT"; echo "emoji=✅" >> "$GITHUB_OUTPUT"
          fi

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port:    ${{ secrets.SMTP_PORT }}
          secure:         true
          username:       ${{ secrets.SMTP_USERNAME }}
          password:       ${{ secrets.SMTP_PASSWORD }}
          to:             ${{ secrets.EMAIL_TO }}
          from:           Aegis Release <${{ secrets.SMTP_USERNAME }}>
          subject:        "${{ steps.status.outputs.emoji }} [Aegis Release] ${{ steps.status.outputs.value }} — prod ${{ needs.prepare.outputs.tag }}"
          body: |
            Aegis Health — Production Release Pipeline

            Status      : ${{ steps.status.outputs.value }}
            Release tag : ${{ needs.prepare.outputs.tag }}
            Namespace   : aegis-prod
            Actor       : ${{ github.actor }}
            Run         : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
