name: Build

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/**'
      - 'client/**'
      - 'shared/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/**'
      - 'client/**'
      - 'shared/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: "Prepare"
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push the auto-generated semver tag on main

    outputs:
      tag:         ${{ steps.out.outputs.tag }}
      push:        ${{ steps.out.outputs.push }}
      matrix:      ${{ steps.matrix.outputs.matrix }}
      any_changed: ${{ steps.matrix.outputs.any_changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve base SHA
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
          fi

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            api-gateway:
              - 'services/api-gateway/**'
              - 'shared/**'
            health-records-service:
              - 'services/health-records-service/**'
            medication-service:
              - 'services/medication-service/**'
            ai-service:
              - 'services/ai-service/**'
            notification-worker:
              - 'services/notification-worker/**'
            imaging-service:
              - 'services/imaging-service/**'
            diagnostic-agent-service:
              - 'services/diagnostic-agent-service/**'
            coordinator-agent:
              - 'services/coordinator-agent/**'
            image-analysis-agent:
              - 'services/image-analysis-agent/**'
            patient-history-agent:
              - 'services/patient-history-agent/**'
            client:
              - 'client/**'

      - name: Set tag and push flag
        id: out
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            git fetch --tags --quiet
            LATEST=$(git describe --tags --match "v[0-9]*.[0-9]*.[0-9]*" --abbrev=0 2>/dev/null || echo "v0.0.0")
            echo "Latest tag: ${LATEST}"

            MAJOR=$(echo "${LATEST#v}" | cut -d. -f1)
            MINOR=$(echo "${LATEST#v}" | cut -d. -f2)
            PATCH=$(echo "${LATEST#v}" | cut -d. -f3)

            COMMITS=$(git log "${LATEST}..HEAD" --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")
            if echo "${COMMITS}" | grep -qE "(BREAKING CHANGE|^.+!:)"; then
              NEXT="v$((MAJOR + 1)).0.0"
            elif echo "${COMMITS}" | grep -qE "^feat(\(.+\))?:"; then
              NEXT="v${MAJOR}.$((MINOR + 1)).0"
            else
              NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi

            TAG="${NEXT}"
            echo "Auto-versioning: ${LATEST} → ${TAG}"

            git tag "${TAG}" 2>/dev/null || echo "ℹ Tag ${TAG} already exists locally"
            git push origin "${TAG}" || echo "⚠ Tag ${TAG} already on remote — reusing"
          else
            TAG="sha-${GITHUB_SHA:0:7}"
          fi

          if [ -z "${TAG}" ]; then
            TAG="sha-${GITHUB_SHA:0:7}"
            echo "⚠ TAG was empty — falling back to SHA: ${TAG}"
          fi

          echo "tag=${TAG}"  >> "$GITHUB_OUTPUT"
          echo "push=${{ github.event_name == 'push' && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"

      - name: Build service matrix
        id: matrix
        shell: bash
        run: |
          declare -a svc=()

          # node/TS services
          [[ "${{ steps.filter.outputs.api-gateway }}" == "true" ]] && svc+=(
            '{"service":"api-gateway","context":".","dockerfile":"services/api-gateway/Dockerfile","lang":"node","dir":"services/api-gateway","sonar_key":"health-aegis_api-gateway"}'
          )
          [[ "${{ steps.filter.outputs.health-records-service }}" == "true" ]] && svc+=(
            '{"service":"health-records-service","context":"services/health-records-service","dockerfile":"services/health-records-service/Dockerfile","lang":"node","dir":"services/health-records-service","sonar_key":"health-aegis_health-records-service"}'
          )
          [[ "${{ steps.filter.outputs.medication-service }}" == "true" ]] && svc+=(
            '{"service":"medication-service","context":"services/medication-service","dockerfile":"services/medication-service/Dockerfile","lang":"node","dir":"services/medication-service","sonar_key":"health-aegis_medication-service"}'
          )
          [[ "${{ steps.filter.outputs.ai-service }}" == "true" ]] && svc+=(
            '{"service":"ai-service","context":"services/ai-service","dockerfile":"services/ai-service/Dockerfile","lang":"node","dir":"services/ai-service","sonar_key":"health-aegis_ai-service"}'
          )
          [[ "${{ steps.filter.outputs.notification-worker }}" == "true" ]] && svc+=(
            '{"service":"notification-worker","context":"services/notification-worker","dockerfile":"services/notification-worker/Dockerfile","lang":"node","dir":"services/notification-worker","sonar_key":"health-aegis_notification-worker"}'
          )
          [[ "${{ steps.filter.outputs.client }}" == "true" ]] && svc+=(
            '{"service":"client","context":".","dockerfile":"client/Dockerfile","lang":"node","dir":"client","sonar_key":"health-aegis_client"}'
          )

          # python services
          [[ "${{ steps.filter.outputs.imaging-service }}" == "true" ]] && svc+=(
            '{"service":"imaging-service","context":"services/imaging-service","dockerfile":"services/imaging-service/Dockerfile","lang":"python","dir":"services/imaging-service","sonar_key":"health-aegis_imaging-service"}'
          )
          [[ "${{ steps.filter.outputs.diagnostic-agent-service }}" == "true" ]] && svc+=(
            '{"service":"diagnostic-agent-service","context":"services/diagnostic-agent-service","dockerfile":"services/diagnostic-agent-service/Dockerfile","lang":"python","dir":"services/diagnostic-agent-service","sonar_key":"health-aegis_diagnostic-agent-service"}'
          )
          [[ "${{ steps.filter.outputs.coordinator-agent }}" == "true" ]] && svc+=(
            '{"service":"coordinator-agent","context":"services/coordinator-agent","dockerfile":"services/coordinator-agent/Dockerfile","lang":"python","dir":"services/coordinator-agent","sonar_key":"health-aegis_coordinator-agent"}'
          )
          [[ "${{ steps.filter.outputs.image-analysis-agent }}" == "true" ]] && svc+=(
            '{"service":"image-analysis-agent","context":"services/image-analysis-agent","dockerfile":"services/image-analysis-agent/Dockerfile","lang":"python","dir":"services/image-analysis-agent","sonar_key":"health-aegis_image-analysis-agent"}'
          )
          [[ "${{ steps.filter.outputs.patient-history-agent }}" == "true" ]] && svc+=(
            '{"service":"patient-history-agent","context":"services/patient-history-agent","dockerfile":"services/patient-history-agent/Dockerfile","lang":"python","dir":"services/patient-history-agent","sonar_key":"health-aegis_patient-history-agent"}'
          )

          if [ ${#svc[@]} -eq 0 ]; then
            echo 'matrix={"include":[]}'  >> "$GITHUB_OUTPUT"
            echo 'any_changed=false'      >> "$GITHUB_OUTPUT"
          else
            joined=$(printf ',%s' "${svc[@]}")
            echo "matrix={\"include\":[${joined:1}]}" >> "$GITHUB_OUTPUT"
            echo 'any_changed=true' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: "Test — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.any_changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Run tests (Node)
        if: matrix.lang == 'node'
        working-directory: ${{ matrix.dir }}
        run: |
          npm ci --prefer-offline --no-audit
          npm test --if-present

      - name: Run tests (Python)
        if: matrix.lang == 'python'
        working-directory: ${{ matrix.dir }}
        run: |
          pip install -r requirements.txt --quiet
          python -m pytest tests/ -v --tb=short 2>/dev/null \
            || echo "No tests directory found — skipping"

  sonar:
    name: "SonarCloud — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.any_changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: ${{ matrix.dir }}
          args: >
            -Dsonar.projectKey=health-aegis_health-aegis
            -Dsonar.organization=health-aegis
            -Dsonar.sources=src
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

  snyk:
    name: "Snyk — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.any_changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Install Node dependencies for Snyk
        if: matrix.lang == 'node'
        working-directory: ${{ matrix.dir }}
        run: npm ci --prefer-offline --no-audit

      - name: Install Python dependencies for Snyk
        if: matrix.lang == 'python'
        working-directory: ${{ matrix.dir }}
        run: pip install -r requirements.txt --quiet

      - name: Snyk dependency scan (Node)
        if: matrix.lang == 'node'
        working-directory: ${{ matrix.dir }}
        run: snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk dependency scan (Python)
        if: matrix.lang == 'python'
        working-directory: ${{ matrix.dir }}
        run: snyk test --severity-threshold=high --file=requirements.txt
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  build:
    name: "Build — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [prepare, test, sonar, snyk]
    if: needs.prepare.outputs.any_changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context:    ${{ matrix.context }}
          file:       ${{ matrix.dockerfile }}
          push:       false
          load:       true
          tags:       ${{ secrets.ACR_NAME }}.azurecr.io/${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,scope=${{ matrix.service }},mode=max
          build-args: |
            ${{ matrix.service == 'client' && format('VITE_API_URL={0}', secrets.VITE_API_URL) || '' }}

      - name: Save image to artifact
        run: |
          IMAGE="${{ secrets.ACR_NAME }}.azurecr.io/${{ matrix.service }}:${{ needs.prepare.outputs.tag }}"
          docker save "$IMAGE" | gzip > /tmp/${{ matrix.service }}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name:            image-${{ matrix.service }}-${{ needs.prepare.outputs.tag }}
          path:            /tmp/${{ matrix.service }}.tar.gz
          retention-days:  1

  trivy:
    name: "Trivy — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: needs.prepare.outputs.any_changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    permissions:
      contents:        read
      security-events: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ needs.prepare.outputs.tag }}
          path: /tmp

      - name: Load image
        run: docker load < /tmp/${{ matrix.service }}.tar.gz

      - name: Trivy vulnerability scan (enforce gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:      ${{ secrets.ACR_NAME }}.azurecr.io/${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
          format:         table
          severity:       HIGH,CRITICAL
          exit-code:      '1'
          ignore-unfixed: true
          scanners:       vuln

      - name: Trivy vulnerability scan (SARIF upload)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref:      ${{ secrets.ACR_NAME }}.azurecr.io/${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
          format:         sarif
          output:         trivy-${{ matrix.service }}.sarif
          severity:       HIGH,CRITICAL
          exit-code:      '0'
          ignore-unfixed: true
          scanners:       vuln

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category:   trivy-${{ matrix.service }}

  push:
    name: "Push — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [prepare, trivy]
    if: >
      needs.prepare.outputs.any_changed == 'true' &&
      needs.prepare.outputs.push == 'true' &&
      needs.trivy.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    permissions:
      contents:  read
      id-token:  write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ needs.prepare.outputs.tag }}
          path: /tmp

      - name: Load image
        run: docker load < /tmp/${{ matrix.service }}.tar.gz

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Push image
        run: |
          # dev: sha-XXXXXXX tags; prod: vX.Y.Z semver tags
          ACR="${{ secrets.ACR_NAME }}.azurecr.io"
          docker push "${ACR}/${{ matrix.service }}:${{ needs.prepare.outputs.tag }}"

  release:
    name: "Release"
    runs-on: ubuntu-latest
    needs: [prepare, push]
    if: >
      github.ref == 'refs/heads/main' &&
      needs.push.result == 'success'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ needs.prepare.outputs.tag }}
          name:       "Release ${{ needs.prepare.outputs.tag }}"
          body: |
            ## Aegis Health — ${{ needs.prepare.outputs.tag }}

            **Commit**: ${{ github.sha }}
            **Actor**:  ${{ github.actor }}
            **Run**:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Images pushed to ACR
            All images are available at `${{ secrets.ACR_NAME }}.azurecr.io/<service>:${{ needs.prepare.outputs.tag }}`
          generate_release_notes: true
          make_latest:            true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  notify:
    name: "Notify"
    runs-on: ubuntu-latest
    needs: [prepare, test, sonar, snyk, build, trivy, push, release]
    if: always()
    steps:
      - name: Resolve pipeline status
        id: status
        shell: bash
        run: |
          RESULTS="${{ join(needs.*.result, ',') }}"
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then
            echo "value=failure" >> "$GITHUB_OUTPUT"
            echo "emoji=❌"      >> "$GITHUB_OUTPUT"
          else
            echo "value=success" >> "$GITHUB_OUTPUT"
            echo "emoji=✅"      >> "$GITHUB_OUTPUT"
          fi

      - name: Send notification email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port:    ${{ secrets.SMTP_PORT }}
          secure:         true
          username:       ${{ secrets.SMTP_USERNAME }}
          password:       ${{ secrets.SMTP_PASSWORD }}
          to:             ${{ secrets.EMAIL_TO }}
          from:           Aegis CI <${{ secrets.SMTP_USERNAME }}>
          subject:        "${{ steps.status.outputs.emoji }} [Aegis Build] ${{ steps.status.outputs.value }} — ${{ github.ref_name }} #${{ github.run_number }}"
          body: |
            Aegis Health — Build Pipeline

            Status    : ${{ steps.status.outputs.value }}
            Branch    : ${{ github.ref_name }}
            Commit    : ${{ github.sha }}
            Tag       : ${{ needs.prepare.outputs.tag }}
            Actor     : ${{ github.actor }}
            Run       : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
