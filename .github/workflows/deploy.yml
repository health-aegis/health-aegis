# ---------------------------------------------------------------------------
# Aegis Health — Deploy Pipeline
#
# JOB GRAPH:
#
#   resolve-env ──► await-approval (prod only) ──► update-manifest ──► notify
#
# • resolve-env      — determines environment (dev/prod) and image tag from the
#                      build trigger; only proceeds when Build succeeded
# • await-approval   — pauses for a human reviewer BEFORE prod deploys
#                      (Settings → Environments → production → Required reviewers)
# • update-manifest  — runs kustomize edit set image for every changed service,
#                      commits the tag bump back to the repo, then kubectl apply
# • notify           — email on ALL outcomes (always)
#
# Environments:
#   develop → dev  → k8s/dev  overlay → namespace aegis-dev
#   main    → prod → k8s/prod overlay → namespace aegis-prod
#
# Required secrets (set in health-aegis repo → Settings → Secrets → Actions):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID  — OIDC
#   ACR_NAME            — registry name without .azurecr.io (e.g. aegistestacr)
#   GITOPS_PAT          — PAT with repo write on health-aegis/k8s-manifests
#   SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, EMAIL_TO
# ---------------------------------------------------------------------------

name: Deploy

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main, develop]

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      image_tag:
        description: "Override image tag (blank = derive from commit SHA)"
        required: false
        type: string

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || inputs.environment }}
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — RESOLVE ENV + TAG
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  resolve-env:
    name: "CD – Resolve environment"
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    outputs:
      tag:       ${{ steps.resolve.outputs.tag }}
      env:       ${{ steps.resolve.outputs.env }}
      namespace: ${{ steps.resolve.outputs.namespace }}
      overlay:   ${{ steps.resolve.outputs.overlay }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve environment and image tag
        id: resolve
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch || inputs.environment }}"
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"

          if [[ -n "${{ inputs.image_tag }}" ]]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="sha-${SHA:0:7}"
          fi

          if [[ "${BRANCH}" == "main" || "${{ inputs.environment }}" == "prod" ]]; then
            ENV="prod"
            NAMESPACE="aegis-prod"
            OVERLAY="k8s/prod"
          else
            ENV="dev"
            NAMESPACE="aegis-dev"
            OVERLAY="k8s/dev"
          fi

          echo "tag=${TAG}"             >> "$GITHUB_OUTPUT"
          echo "env=${ENV}"             >> "$GITHUB_OUTPUT"
          echo "namespace=${NAMESPACE}" >> "$GITHUB_OUTPUT"
          echo "overlay=${OVERLAY}"     >> "$GITHUB_OUTPUT"

          echo "Resolved → env=${ENV}  tag=${TAG}  overlay=${OVERLAY}"

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — AWAIT APPROVAL  (prod only — skipped entirely for dev)
# Configure required reviewers: Settings → Environments → production
# ─────────────────────────────────────────────────────────────────────────────
  await-approval:
    name: "CD – Await production approval"
    runs-on: ubuntu-latest
    needs: resolve-env
    if: needs.resolve-env.outputs.env == 'prod'
    environment: production
    steps:
      - name: Approval granted
        run: echo "✅ Production deployment approved — proceeding."

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — UPDATE MANIFEST
# Detects which services changed, then patches each service's individual
# values-dev.yaml / values-prod.yaml image.tag in k8s-manifests.
# ArgoCD watches k8s-manifests and syncs the cluster automatically.
#
# Requires secret GITOPS_PAT — a PAT with repo write scope on
# health-aegis/k8s-manifests (same PAT used by terraform-aegis).
# ─────────────────────────────────────────────────────────────────────────────
  update-manifest:
    name: "CD – Update manifests (${{ needs.resolve-env.outputs.env }})"
    runs-on: ubuntu-latest
    needs: [resolve-env, await-approval]

    if: |
      always() &&
      needs.resolve-env.result == 'success' &&
      (needs.await-approval.result == 'success' || needs.await-approval.result == 'skipped')

    permissions:
      contents: read

    steps:
      # ── Checkout health-aegis at the triggering commit ───────────────────────
      - uses: actions/checkout@v4
        with:
          ref:        ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # ── Detect which services changed in the triggering build ────────────────
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'services/api-gateway/**'
              - 'shared/**'
            health-records-service:
              - 'services/health-records-service/**'
            medication-service:
              - 'services/medication-service/**'
            ai-service:
              - 'services/ai-service/**'
            notification-worker:
              - 'services/notification-worker/**'
            imaging-service:
              - 'services/imaging-service/**'
            diagnostic-agent-service:
              - 'services/diagnostic-agent-service/**'
            coordinator-agent:
              - 'services/coordinator-agent/**'
            image-analysis-agent:
              - 'services/image-analysis-agent/**'
            patient-history-agent:
              - 'services/patient-history-agent/**'
            client:
              - 'client/**'

      # ── Checkout k8s-manifests (GitOps repo) ────────────────────────────────
      # ArgoCD watches k8s-manifests/environments/dev — the umbrella chart.
      # Patching <subchart>.image.tag here is what actually triggers a rollout.
      - name: Checkout k8s-manifests
        uses: actions/checkout@v4
        with:
          repository: health-aegis/k8s-manifests
          token:      ${{ secrets.GITOPS_PAT }}
          path:       k8s-manifests

      # ── Patch .image.tag in charts/<service>/values-<env>.yaml ──────────────
      # Each ArgoCD Application reads charts/<svc>/values.yaml (base) +
      # charts/<svc>/values-<env>.yaml (env overrides including image.tag).
      # sync-helm-charts.yml keeps static config (resources, HPA, acrLoginServer)
      # in sync; we only update .image.tag here so AGIC/ArgoCD picks up the rollout.
      - name: Patch image tags in k8s-manifests
        env:
          TAG:                        ${{ needs.resolve-env.outputs.tag }}
          ENV:                        ${{ needs.resolve-env.outputs.env }}
          CHANGED_api_gateway:        ${{ steps.filter.outputs.api-gateway }}
          CHANGED_health_records:     ${{ steps.filter.outputs.health-records-service }}
          CHANGED_medication:         ${{ steps.filter.outputs.medication-service }}
          CHANGED_ai:                 ${{ steps.filter.outputs.ai-service }}
          CHANGED_notification:       ${{ steps.filter.outputs.notification-worker }}
          CHANGED_imaging:            ${{ steps.filter.outputs.imaging-service }}
          CHANGED_diagnostic:         ${{ steps.filter.outputs.diagnostic-agent-service }}
          CHANGED_coordinator:        ${{ steps.filter.outputs.coordinator-agent }}
          CHANGED_image_analysis:     ${{ steps.filter.outputs.image-analysis-agent }}
          CHANGED_patient_history:    ${{ steps.filter.outputs.patient-history-agent }}
          CHANGED_client:             ${{ steps.filter.outputs.client }}
        run: |
          patch_tag() {
            local SVC="$1" CHANGED="$2"
            [ "$CHANGED" != "true" ] && return
            local VALUES="k8s-manifests/charts/${SVC}/values-${ENV}.yaml"
            if [ ! -f "$VALUES" ]; then
              echo "  ⚠ ${VALUES} not found — skipping ${SVC} (run sync-helm-charts first)"; return
            fi
            yq -i ".image.tag = \"${TAG}\"" "${VALUES}"
            echo "  ✓ ${SVC}.image.tag → ${TAG}"
          }

          patch_tag api-gateway              "$CHANGED_api_gateway"
          patch_tag health-records-service   "$CHANGED_health_records"
          patch_tag medication-service       "$CHANGED_medication"
          patch_tag ai-service               "$CHANGED_ai"
          patch_tag notification-worker      "$CHANGED_notification"
          patch_tag imaging-service          "$CHANGED_imaging"
          patch_tag diagnostic-agent-service "$CHANGED_diagnostic"
          patch_tag coordinator-agent        "$CHANGED_coordinator"
          patch_tag image-analysis-agent     "$CHANGED_image_analysis"
          patch_tag patient-history-agent    "$CHANGED_patient_history"
          patch_tag client                   "$CHANGED_client"

      # ── Commit and push to k8s-manifests ────────────────────────────────────
      - name: Commit image tag bump to k8s-manifests
        working-directory: k8s-manifests
        env:
          ENV:    ${{ needs.resolve-env.outputs.env }}
          TAG:    ${{ needs.resolve-env.outputs.tag }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add charts/
          git diff --cached --quiet \
            && echo "No image tag changes to commit." \
            && exit 0

          git commit -m "chore(deploy): bump ${ENV} image tags to ${TAG} [${BRANCH}] [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      # ── Step summary ─────────────────────────────────────────────────────────
      - name: Write deploy summary
        if: always()
        run: |
          {
            echo "## Deploy — \`${{ needs.resolve-env.outputs.env }}\` — \`${{ job.status }}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Tag** | \`${{ needs.resolve-env.outputs.tag }}\` |"
            echo "| **Namespace** | \`${{ needs.resolve-env.outputs.namespace }}\` |"
            echo "| **Actor** | \`${{ github.actor }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4 — NOTIFY  (always)
# ─────────────────────────────────────────────────────────────────────────────
  notify:
    name: "Notify"
    runs-on: ubuntu-latest
    needs: [resolve-env, await-approval, update-manifest]
    if: always()
    steps:
      - name: Resolve status
        id: status
        run: |
          RESULTS="${{ join(needs.*.result, ',') }}"
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then
            echo "value=failure" >> "$GITHUB_OUTPUT"; echo "emoji=❌" >> "$GITHUB_OUTPUT"
          else
            echo "value=success" >> "$GITHUB_OUTPUT"; echo "emoji=✅" >> "$GITHUB_OUTPUT"
          fi

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port:    ${{ secrets.SMTP_PORT }}
          secure:         true
          username:       ${{ secrets.SMTP_USERNAME }}
          password:       ${{ secrets.SMTP_PASSWORD }}
          to:             ${{ secrets.EMAIL_TO }}
          from:           Aegis CD <${{ secrets.SMTP_USERNAME }}>
          subject:        "${{ steps.status.outputs.emoji }} [Aegis Deploy] ${{ steps.status.outputs.value }} — ${{ needs.resolve-env.outputs.env }} ${{ needs.resolve-env.outputs.tag }}"
          body: |
            Aegis Health — Deploy Pipeline

            Status      : ${{ steps.status.outputs.value }}
            Environment : ${{ needs.resolve-env.outputs.env }}
            Tag         : ${{ needs.resolve-env.outputs.tag }}
            Namespace   : ${{ needs.resolve-env.outputs.namespace }}
            Actor       : ${{ github.actor }}
            Run         : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
