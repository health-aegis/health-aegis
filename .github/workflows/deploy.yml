# ---------------------------------------------------------------------------
# Aegis Health — Deploy Pipeline
#
# JOB GRAPH:
#
#   resolve-env ──► await-approval (prod only) ──► update-manifest ──► notify
#
# • resolve-env      — determines environment (dev/prod) and image tag from the
#                      build trigger; only proceeds when Build succeeded
# • await-approval   — pauses for a human reviewer BEFORE prod deploys
#                      (Settings → Environments → production → Required reviewers)
# • update-manifest  — runs kustomize edit set image for every changed service,
#                      commits the tag bump back to the repo, then kubectl apply
# • notify           — email on ALL outcomes (always)
#
# Environments:
#   develop → dev  → k8s/dev  overlay → namespace aegis-dev
#   main    → prod → k8s/prod overlay → namespace aegis-prod
#
# Required secrets:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID  — OIDC
#   ACR_NAME            — registry name without .azurecr.io (test or prod ACR)
#   AKS_CLUSTER_NAME    — cluster name
#   AKS_RESOURCE_GROUP  — resource group
#   SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, EMAIL_TO
# ---------------------------------------------------------------------------

name: Deploy

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main, develop]

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      image_tag:
        description: "Override image tag (blank = derive from commit SHA)"
        required: false
        type: string

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || inputs.environment }}
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — RESOLVE ENV + TAG
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  resolve-env:
    name: "CD – Resolve environment"
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    outputs:
      tag:       ${{ steps.resolve.outputs.tag }}
      env:       ${{ steps.resolve.outputs.env }}
      namespace: ${{ steps.resolve.outputs.namespace }}
      overlay:   ${{ steps.resolve.outputs.overlay }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve environment and image tag
        id: resolve
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch || inputs.environment }}"
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"

          if [[ -n "${{ inputs.image_tag }}" ]]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="sha-${SHA:0:7}"
          fi

          if [[ "${BRANCH}" == "main" || "${{ inputs.environment }}" == "prod" ]]; then
            ENV="prod"
            NAMESPACE="aegis-prod"
            OVERLAY="k8s/prod"
          else
            ENV="dev"
            NAMESPACE="aegis-dev"
            OVERLAY="k8s/dev"
          fi

          echo "tag=${TAG}"             >> "$GITHUB_OUTPUT"
          echo "env=${ENV}"             >> "$GITHUB_OUTPUT"
          echo "namespace=${NAMESPACE}" >> "$GITHUB_OUTPUT"
          echo "overlay=${OVERLAY}"     >> "$GITHUB_OUTPUT"

          echo "Resolved → env=${ENV}  tag=${TAG}  overlay=${OVERLAY}"

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — AWAIT APPROVAL  (prod only — skipped entirely for dev)
# Configure required reviewers: Settings → Environments → production
# ─────────────────────────────────────────────────────────────────────────────
  await-approval:
    name: "CD – Await production approval"
    runs-on: ubuntu-latest
    needs: resolve-env
    if: needs.resolve-env.outputs.env == 'prod'
    environment: production
    steps:
      - name: Approval granted
        run: echo "✅ Production deployment approved — proceeding."

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — UPDATE MANIFEST + APPLY
# Detects changed services, patches kustomize image tags, commits, then applies
# ─────────────────────────────────────────────────────────────────────────────
  update-manifest:
    name: "CD – Update manifests & deploy (${{ needs.resolve-env.outputs.env }})"
    runs-on: ubuntu-latest
    needs: [resolve-env, await-approval]

    if: |
      always() &&
      needs.resolve-env.result == 'success' &&
      (needs.await-approval.result == 'success' || needs.await-approval.result == 'skipped')

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      # ── Detect which services changed ───────────────────────────────────────
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'services/api-gateway/**'
              - 'shared/**'
            health-records-service:
              - 'services/health-records-service/**'
            medication-service:
              - 'services/medication-service/**'
            ai-service:
              - 'services/ai-service/**'
            notification-worker:
              - 'services/notification-worker/**'
            imaging-service:
              - 'services/imaging-service/**'
            diagnostic-agent:
              - 'services/diagnostic-agent-service/**'
            coordinator-agent:
              - 'services/coordinator-agent/**'
            image-analysis-agent:
              - 'services/image-analysis-agent/**'
            patient-history-agent:
              - 'services/patient-history-agent/**'
            client:
              - 'client/**'

      # ── Patch kustomize image tags ──────────────────────────────────────────
      # kustomize edit set image replaces newName + newTag in the overlay's
      # images: section, keeping the base deployment.yaml untouched.
      - name: Update image tags in kustomize overlay
        run: |
          OVERLAY="${{ needs.resolve-env.outputs.overlay }}"
          TAG="${{ needs.resolve-env.outputs.tag }}"
          ACR="${{ secrets.ACR_NAME }}.azurecr.io"
          UPDATED=()

          cd "${OVERLAY}"

          update() {
            local svc="$1"
            kustomize edit set image "${svc}=${ACR}/${svc}:${TAG}"
            UPDATED+=("${svc}")
            echo "→ ${svc}=${ACR}/${svc}:${TAG}"
          }

          [[ "${{ steps.filter.outputs.api-gateway }}"           == "true" ]] && update api-gateway
          [[ "${{ steps.filter.outputs.health-records-service }}" == "true" ]] && update health-records-service
          [[ "${{ steps.filter.outputs.medication-service }}"    == "true" ]] && update medication-service
          [[ "${{ steps.filter.outputs.ai-service }}"            == "true" ]] && update ai-service
          [[ "${{ steps.filter.outputs.notification-worker }}"   == "true" ]] && update notification-worker
          [[ "${{ steps.filter.outputs.imaging-service }}"       == "true" ]] && update imaging-service
          [[ "${{ steps.filter.outputs.diagnostic-agent }}"      == "true" ]] && update diagnostic-agent
          [[ "${{ steps.filter.outputs.coordinator-agent }}"     == "true" ]] && update coordinator-agent
          [[ "${{ steps.filter.outputs.image-analysis-agent }}"  == "true" ]] && update image-analysis-agent
          [[ "${{ steps.filter.outputs.patient-history-agent }}" == "true" ]] && update patient-history-agent
          [[ "${{ steps.filter.outputs.client }}"                == "true" ]] && update client

          if [ ${#UPDATED[@]} -eq 0 ]; then
            echo "No services changed — nothing to deploy."
            echo "NOTHING_TO_DEPLOY=true" >> "$GITHUB_ENV"
          else
            echo "Updated: ${UPDATED[*]}"
            printf '%s\n' "${UPDATED[@]}" > /tmp/updated-services.txt
          fi

      # ── Commit the tag bump back to the repo ────────────────────────────────
      - name: Commit manifest changes
        if: env.NOTHING_TO_DEPLOY != 'true'
        run: |
          OVERLAY="${{ needs.resolve-env.outputs.overlay }}"
          TAG="${{ needs.resolve-env.outputs.tag }}"
          ENV="${{ needs.resolve-env.outputs.env }}"
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${OVERLAY}/kustomization.yaml"

          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "chore(deploy): bump ${ENV} image tags to ${TAG} [${BRANCH}] [skip ci]"
            git pull --rebase origin HEAD
            git push
          fi

      # ── Azure Login + AKS credentials ───────────────────────────────────────
      - name: Azure Login (OIDC)
        if: env.NOTHING_TO_DEPLOY != 'true'
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        if: env.NOTHING_TO_DEPLOY != 'true'
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name:   ${{ secrets.AKS_CLUSTER_NAME }}

      # ── Apply manifests to AKS ───────────────────────────────────────────────
      - name: kubectl apply
        if: env.NOTHING_TO_DEPLOY != 'true'
        run: kubectl apply -k ${{ needs.resolve-env.outputs.overlay }}

      # ── Rollout status ───────────────────────────────────────────────────────
      - name: Verify rollout status
        if: env.NOTHING_TO_DEPLOY != 'true'
        run: |
          NS="${{ needs.resolve-env.outputs.namespace }}"
          FAILED=()

          while IFS= read -r svc; do
            echo "⏳ $svc"
            if kubectl rollout status "deployment/$svc" -n "$NS" --timeout=5m; then
              echo "✅ $svc ready"
            else
              echo "❌ $svc failed"
              FAILED+=("$svc")
            fi
          done < /tmp/updated-services.txt

          if [ ${#FAILED[@]} -gt 0 ]; then
            kubectl get pods -n "$NS" --sort-by=.status.startTime
            exit 1
          fi

      # ── Smoke test ───────────────────────────────────────────────────────────
      - name: Smoke test — api-gateway /healthz
        if: env.NOTHING_TO_DEPLOY != 'true'
        run: |
          NS="${{ needs.resolve-env.outputs.namespace }}"
          grep -qx "api-gateway" /tmp/updated-services.txt 2>/dev/null || { echo "api-gateway not updated — skip"; exit 0; }

          kubectl port-forward deployment/api-gateway 15000:5000 -n "$NS" &
          PF_PID=$!
          trap "kill $PF_PID 2>/dev/null" EXIT
          sleep 5

          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:15000/healthz)
            [ "$CODE" = "200" ] && { echo "✅ /healthz → 200"; exit 0; }
            echo "Attempt $i: $CODE — retrying"
            sleep 5
          done
          echo "❌ Smoke test failed"; exit 1

      # ── Step summary ─────────────────────────────────────────────────────────
      - name: Write deploy summary
        if: always()
        run: |
          {
            echo "## Deploy — \`${{ needs.resolve-env.outputs.env }}\` — \`${{ job.status }}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Tag** | \`${{ needs.resolve-env.outputs.tag }}\` |"
            echo "| **Namespace** | \`${{ needs.resolve-env.outputs.namespace }}\` |"
            echo "| **Actor** | \`${{ github.actor }}\` |"
            if [ -f /tmp/updated-services.txt ]; then
              echo ""
              echo "### Updated"
              while IFS= read -r s; do echo "- \`$s\`"; done < /tmp/updated-services.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4 — NOTIFY  (always)
# ─────────────────────────────────────────────────────────────────────────────
  notify:
    name: "Notify"
    runs-on: ubuntu-latest
    needs: [resolve-env, await-approval, update-manifest]
    if: always()
    steps:
      - name: Resolve status
        id: status
        run: |
          RESULTS="${{ join(needs.*.result, ',') }}"
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then
            echo "value=failure" >> "$GITHUB_OUTPUT"; echo "emoji=❌" >> "$GITHUB_OUTPUT"
          else
            echo "value=success" >> "$GITHUB_OUTPUT"; echo "emoji=✅" >> "$GITHUB_OUTPUT"
          fi

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port:    ${{ secrets.SMTP_PORT }}
          secure:         true
          username:       ${{ secrets.SMTP_USERNAME }}
          password:       ${{ secrets.SMTP_PASSWORD }}
          to:             ${{ secrets.EMAIL_TO }}
          from:           Aegis CD <${{ secrets.SMTP_USERNAME }}>
          subject:        "${{ steps.status.outputs.emoji }} [Aegis Deploy] ${{ steps.status.outputs.value }} — ${{ needs.resolve-env.outputs.env }} ${{ needs.resolve-env.outputs.tag }}"
          body: |
            Aegis Health — Deploy Pipeline

            Status      : ${{ steps.status.outputs.value }}
            Environment : ${{ needs.resolve-env.outputs.env }}
            Tag         : ${{ needs.resolve-env.outputs.tag }}
            Namespace   : ${{ needs.resolve-env.outputs.namespace }}
            Actor       : ${{ github.actor }}
            Run         : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
