name: Deploy

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main, develop]

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      image_tag:
        description: "Image tag override (semver for prod, sha-XXXXXXX for dev)"
        required: false
        type: string

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || inputs.environment }}
  cancel-in-progress: false

jobs:
  resolve-env:
    name: "CD – Resolve environment"
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    outputs:
      tag:                     ${{ steps.out.outputs.tag }}
      env:                     ${{ steps.out.outputs.env }}
      changed_api_gateway:     ${{ steps.filter.outputs.api-gateway }}
      changed_health_records:  ${{ steps.filter.outputs.health-records-service }}
      changed_medication:      ${{ steps.filter.outputs.medication-service }}
      changed_ai:              ${{ steps.filter.outputs.ai-service }}
      changed_notification:    ${{ steps.filter.outputs.notification-worker }}
      changed_imaging:         ${{ steps.filter.outputs.imaging-service }}
      changed_diagnostic:      ${{ steps.filter.outputs.diagnostic-agent-service }}
      changed_coordinator:     ${{ steps.filter.outputs.coordinator-agent }}
      changed_image_analysis:  ${{ steps.filter.outputs.image-analysis-agent }}
      changed_patient_history: ${{ steps.filter.outputs.patient-history-agent }}
      changed_client:          ${{ steps.filter.outputs.client }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref:         ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            api-gateway:
              - 'services/api-gateway/**'
              - 'shared/**'
            health-records-service:
              - 'services/health-records-service/**'
            medication-service:
              - 'services/medication-service/**'
            ai-service:
              - 'services/ai-service/**'
            notification-worker:
              - 'services/notification-worker/**'
            imaging-service:
              - 'services/imaging-service/**'
            diagnostic-agent-service:
              - 'services/diagnostic-agent-service/**'
            coordinator-agent:
              - 'services/coordinator-agent/**'
            image-analysis-agent:
              - 'services/image-analysis-agent/**'
            patient-history-agent:
              - 'services/patient-history-agent/**'
            client:
              - 'client/**'

      - name: Resolve environment and tag
        id: out
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch || inputs.environment }}"
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"

          if [[ "${BRANCH}" == "main" || "${{ inputs.environment }}" == "prod" ]]; then
            ENV="prod"
            git fetch --tags --quiet
            TAG=$(git describe --tags --match "v[0-9]*.[0-9]*.[0-9]*" --abbrev=0 2>/dev/null || true)
            if [ -z "$TAG" ]; then
              TAG="${{ inputs.image_tag }}"
            fi
            if [ -z "$TAG" ]; then
              echo "⚠ No semver tag found — falling back to SHA"
              TAG="sha-${SHA:0:7}"
            fi
          else
            ENV="dev"
            TAG="${{ inputs.image_tag }}"
            if [ -z "$TAG" ]; then
              TAG="sha-${SHA:0:7}"
            fi
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "env=${ENV}" >> "$GITHUB_OUTPUT"
          echo "Resolved → env=${ENV}  tag=${TAG}"

  await-approval:
    name: "CD – Await production approval"
    runs-on: ubuntu-latest
    needs: resolve-env
    if: needs.resolve-env.outputs.env == 'prod'
    environment: production
    steps:
      - run: echo "✅ Production deployment approved."

  deploy-api-gateway:
    needs: [resolve-env, await-approval]
    if: |
      always() &&
      needs.resolve-env.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.resolve-env.outputs.changed_api_gateway == 'true') &&
      (needs.await-approval.result == 'success' || needs.await-approval.result == 'skipped')
    uses: ./.github/workflows/common-cd.yml
    with:
      service-name:   api-gateway
      helm-chart-key: api-gateway
      env:            ${{ needs.resolve-env.outputs.env }}
      tag:            ${{ needs.resolve-env.outputs.tag }}
    secrets:
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}

  deploy-health-records:
    needs: [resolve-env, await-approval]
    if: |
      always() &&
      needs.resolve-env.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.resolve-env.outputs.changed_health_records == 'true') &&
      (needs.await-approval.result == 'success' || needs.await-approval.result == 'skipped')
    uses: ./.github/workflows/common-cd.yml
    with:
      service-name:   health-records-service
      helm-chart-key: health-records-service
      env:            ${{ needs.resolve-env.outputs.env }}
      tag:            ${{ needs.resolve-env.outputs.tag }}
    secrets:
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}

  deploy-medication:
    needs: [resolve-env, await-approval]
    if: |
      always() &&
      needs.resolve-env.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.resolve-env.outputs.changed_medication == 'true') &&
      (needs.await-approval.result == 'success' || needs.await-approval.result == 'skipped')
    uses: ./.github/workflows/common-cd.yml
    with:
      service-name:   medication-service
      helm-chart-key: medication-service
      env:            ${{ needs.resolve-env.outputs.env }}
      tag:            ${{ needs.resolve-env.outputs.tag }}
    secrets:
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}

  deploy-ai:
    needs: [resolve-env, await-approval]
    if: |
      always() &&
      needs.resolve-env.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.resolve-env.outputs.changed_ai == 'true') &&
      (needs.await-approval.result == 'success' || needs.await-approval.result == 'skipped')
    uses: ./.github/workflows/common-cd.yml
    with:
      service-name:   ai-service
      helm-chart-key: ai-service
      env:            ${{ needs.resolve-env.outputs.env }}
      tag:            ${{ needs.resolve-env.outputs.tag }}
    secrets:
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}

  deploy-notification:
    needs: [resolve-env, await-approval]
    if: |
      always() &&
      needs.resolve-env.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.resolve-env.outputs.changed_notification == 'true') &&
      (needs.await-approval.result == 'success' || needs.await-approval.result == 'skipped')
    uses: ./.github/workflows/common-cd.yml
    with:
      service-name:   notification-worker
      helm-chart-key: notification-worker
      env:            ${{ needs.resolve-env.outputs.env }}
      tag:            ${{ needs.resolve-env.outputs.tag }}
    secrets:
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}

  deploy-imaging:
    needs: [resolve-env, await-approval]
    if: |
      always() &&
      needs.resolve-env.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.resolve-env.outputs.changed_imaging == 'true') &&
      (needs.await-approval.result == 'success' || needs.await-approval.result == 'skipped')
    uses: ./.github/workflows/common-cd.yml
    with:
      service-name:   imaging-service
      helm-chart-key: imaging-service
      env:            ${{ needs.resolve-env.outputs.env }}
      tag:            ${{ needs.resolve-env.outputs.tag }}
    secrets:
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}

  deploy-diagnostic:
    needs: [resolve-env, await-approval]
    if: |
      always() &&
      needs.resolve-env.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.resolve-env.outputs.changed_diagnostic == 'true') &&
      (needs.await-approval.result == 'success' || needs.await-approval.result == 'skipped')
    uses: ./.github/workflows/common-cd.yml
    with:
      service-name:   diagnostic-agent-service
      helm-chart-key: diagnostic-agent-service
      env:            ${{ needs.resolve-env.outputs.env }}
      tag:            ${{ needs.resolve-env.outputs.tag }}
    secrets:
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}

  deploy-coordinator:
    needs: [resolve-env, await-approval]
    if: |
      always() &&
      needs.resolve-env.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.resolve-env.outputs.changed_coordinator == 'true') &&
      (needs.await-approval.result == 'success' || needs.await-approval.result == 'skipped')
    uses: ./.github/workflows/common-cd.yml
    with:
      service-name:   coordinator-agent
      helm-chart-key: coordinator-agent
      env:            ${{ needs.resolve-env.outputs.env }}
      tag:            ${{ needs.resolve-env.outputs.tag }}
    secrets:
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}

  deploy-image-analysis:
    needs: [resolve-env, await-approval]
    if: |
      always() &&
      needs.resolve-env.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.resolve-env.outputs.changed_image_analysis == 'true') &&
      (needs.await-approval.result == 'success' || needs.await-approval.result == 'skipped')
    uses: ./.github/workflows/common-cd.yml
    with:
      service-name:   image-analysis-agent
      helm-chart-key: image-analysis-agent
      env:            ${{ needs.resolve-env.outputs.env }}
      tag:            ${{ needs.resolve-env.outputs.tag }}
    secrets:
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}

  deploy-patient-history:
    needs: [resolve-env, await-approval]
    if: |
      always() &&
      needs.resolve-env.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.resolve-env.outputs.changed_patient_history == 'true') &&
      (needs.await-approval.result == 'success' || needs.await-approval.result == 'skipped')
    uses: ./.github/workflows/common-cd.yml
    with:
      service-name:   patient-history-agent
      helm-chart-key: patient-history-agent
      env:            ${{ needs.resolve-env.outputs.env }}
      tag:            ${{ needs.resolve-env.outputs.tag }}
    secrets:
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}

  deploy-client:
    needs: [resolve-env, await-approval]
    if: |
      always() &&
      needs.resolve-env.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.resolve-env.outputs.changed_client == 'true') &&
      (needs.await-approval.result == 'success' || needs.await-approval.result == 'skipped')
    uses: ./.github/workflows/common-cd.yml
    with:
      service-name:   client
      helm-chart-key: client
      env:            ${{ needs.resolve-env.outputs.env }}
      tag:            ${{ needs.resolve-env.outputs.tag }}
    secrets:
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}

  notify:
    name: "Notify"
    runs-on: ubuntu-latest
    needs:
      - resolve-env
      - await-approval
      - deploy-api-gateway
      - deploy-health-records
      - deploy-medication
      - deploy-ai
      - deploy-notification
      - deploy-imaging
      - deploy-diagnostic
      - deploy-coordinator
      - deploy-image-analysis
      - deploy-patient-history
      - deploy-client
    if: always()
    steps:
      - name: Resolve status
        id: status
        run: |
          RESULTS="${{ join(needs.*.result, ',') }}"
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then
            echo "value=failure" >> "$GITHUB_OUTPUT"; echo "emoji=❌" >> "$GITHUB_OUTPUT"
          else
            echo "value=success" >> "$GITHUB_OUTPUT"; echo "emoji=✅" >> "$GITHUB_OUTPUT"
          fi

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port:    ${{ secrets.SMTP_PORT }}
          secure:         true
          username:       ${{ secrets.SMTP_USERNAME }}
          password:       ${{ secrets.SMTP_PASSWORD }}
          to:             ${{ secrets.EMAIL_TO }}
          from:           Aegis CD <${{ secrets.SMTP_USERNAME }}>
          subject:        "${{ steps.status.outputs.emoji }} [Aegis Deploy] ${{ steps.status.outputs.value }} — ${{ needs.resolve-env.outputs.env }} ${{ needs.resolve-env.outputs.tag }}"
          body: |
            Aegis Health — Deploy Pipeline

            Status      : ${{ steps.status.outputs.value }}
            Environment : ${{ needs.resolve-env.outputs.env }}
            Tag         : ${{ needs.resolve-env.outputs.tag }}
            Actor       : ${{ github.actor }}
            Run         : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
