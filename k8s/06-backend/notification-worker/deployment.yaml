apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: aegis
  labels:
    app: notification-worker
    app.kubernetes.io/part-of: aegis-health
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: aegis-workload-identity
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: aegis-kv-secret-provider
      containers:
        - name: notification-worker
          image: notification-worker:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          envFrom:
            - secretRef:
                name: aegis-kv-secrets
            - configMapRef:
                name: aegis-config
          readinessProbe:
            exec:
              command: ["pgrep", "-f", "node"]
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "node"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
