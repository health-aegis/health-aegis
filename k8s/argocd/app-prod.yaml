apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aegis-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/health-aegis/health-aegis.git
    targetRevision: main
    path: helm/aegis-health
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: aegis-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
