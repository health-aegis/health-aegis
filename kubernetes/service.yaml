apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: aegis-prod
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: health-records-service
  namespace: aegis-prod
  labels:
    app: health-records-service
spec:
  selector:
    app: health-records-service
  ports:
    - port: 5001
      targetPort: 5001
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: medication-service
  namespace: aegis-prod
  labels:
    app: medication-service
spec:
  selector:
    app: medication-service
  ports:
    - port: 5002
      targetPort: 5002
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: aegis-prod
  labels:
    app: ai-service
spec:
  selector:
    app: ai-service
  ports:
    - port: 5003
      targetPort: 5003
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: imaging-service
  namespace: aegis-prod
  labels:
    app: imaging-service
spec:
  selector:
    app: imaging-service
  ports:
    - port: 5004
      targetPort: 5004
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: diagnostic-agent-service
  namespace: aegis-prod
  labels:
    app: diagnostic-agent-service
spec:
  selector:
    app: diagnostic-agent-service
  ports:
    - port: 5005
      targetPort: 5005
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator-agent
  namespace: aegis-prod
  labels:
    app: coordinator-agent
spec:
  selector:
    app: coordinator-agent
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: image-analysis-agent
  namespace: aegis-prod
  labels:
    app: image-analysis-agent
spec:
  selector:
    app: image-analysis-agent
  ports:
    - port: 8001
      targetPort: 8001
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: patient-history-agent
  namespace: aegis-prod
  labels:
    app: patient-history-agent
spec:
  selector:
    app: patient-history-agent
  ports:
    - port: 8002
      targetPort: 8002
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: client-service
  namespace: aegis-prod
  labels:
    app: client
spec:
  selector:
    app: client
  ports:
    - port: 80
      targetPort: 80
      name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegis-ingress
  namespace: aegis-prod
  labels:
    app: aegis
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
spec:
  ingressClassName: azure-application-gateway
  rules:
    - http:
        paths:
          - path: /api/history
            pathType: Prefix
            backend:
              service:
                name: health-records-service
                port:
                  number: 5001
          - path: /api/appointments
            pathType: Prefix
            backend:
              service:
                name: health-records-service
                port:
                  number: 5001
          - path: /api/medications
            pathType: Prefix
            backend:
              service:
                name: medication-service
                port:
                  number: 5002
          - path: /api/caregiver
            pathType: Prefix
            backend:
              service:
                name: medication-service
                port:
                  number: 5002
          - path: /api/status
            pathType: Prefix
            backend:
              service:
                name: medication-service
                port:
                  number: 5002
          - path: /api/ai
            pathType: Prefix
            backend:
              service:
                name: ai-service
                port:
                  number: 5003
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-service
                port:
                  number: 80
